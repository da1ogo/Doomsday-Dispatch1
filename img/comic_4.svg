<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Deep black background -->
  <rect width="100%" height="100%" fill="#0a0b0d"/>

  <!-- Concrete wall panels and seams -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#181a1f" stroke-width="2"/>
  <line x1="260" y1="0" x2="260" y2="120" stroke="#181a1f" stroke-width="2"/>
  <line x1="540" y1="0" x2="540" y2="120" stroke="#181a1f" stroke-width="2"/>

  <!-- Overhead surveillance camera looking down from ceiling -->
  <path d="M 680 0 L 710 50 L 750 45 L 720 0 Z" fill="#22262b" stroke="#000" stroke-width="2"/>
  <circle cx="730" cy="50" r="16" fill="#15171a" stroke="#333" stroke-width="2"/>
  <circle cx="730" cy="50" r="7" fill="#000"/>
  <circle cx="733" cy="48" r="3" fill="#ff2222"/>

  <!-- Wall Soviet Stencil Warning Sign -->
  <rect x="50" y="30" width="160" height="65" fill="#141618" stroke="#3a3d42" stroke-width="1.5"/>
  <text x="130" y="52" fill="#c0392b" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle">СЕКТОР «ОМЕГА»</text>
  <text x="130" y="70" fill="#888" font-family="monospace" font-size="9" text-anchor="middle">ПОСТ ДИСПЕТЧЕРА №4</text>
  <text x="130" y="84" fill="#666" font-family="monospace" font-size="8" text-anchor="middle">ВХОД БЕЗ ДОПУСКА — РАССТРЕЛ</text>

  <!-- Heavy Steel Operator Desk Surface -->
  <polygon points="0,450 800,450 740,240 60,240" fill="#1e2226" stroke="#0e1012" stroke-width="3"/>
  <line x1="60" y1="240" x2="740" y2="240" stroke="#32373d" stroke-width="2"/>

  <!-- Massive 1980s CRT Monitor Chassis -->
  <rect x="250" y="110" width="300" height="230" rx="14" fill="#2b2f34" stroke="#0d0e10" stroke-width="4"/>
  <rect x="270" y="125" width="260" height="185" rx="20" fill="#06120a" stroke="#192019" stroke-width="4"/>

  <!-- CRT Screen Glow & Scanlines -->
  <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#33ff66" stop-opacity="0.25"/>
    <stop offset="70%" stop-color="#114422" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#020804" stop-opacity="0.9"/>
  </radialGradient>
  <rect x="275" y="130" width="250" height="175" rx="16" fill="url(#screenGlow)"/>

  <!-- Terminal Content on Screen -->
  <text x="290" y="155" fill="#33ff66" font-family="'Courier New', monospace" font-size="12" font-weight="bold">> BunkerOS v3.11</text>
  <text x="290" y="175" fill="#22aa44" font-family="'Courier New', monospace" font-size="10">> ПОЛЬЗОВАТЕЛЬ: ВОЛКОВ А.И.</text>
  <text x="290" y="195" fill="#22aa44" font-family="'Courier New', monospace" font-size="10">> СТАТУС: НА СМЕНЕ</text>
  <rect x="290" y="210" width="220" height="1" fill="#33ff66" opacity="0.4"/>
  <text x="290" y="230" fill="#ffff55" font-family="'Courier New', monospace" font-size="11" font-weight="bold">[ ВНИМАНИЕ: СМЕНА №5 ]</text>
  <text x="290" y="250" fill="#33ff66" font-family="'Courier New', monospace" font-size="10">ОЖИДАНИЕ ВВОДА ДАННЫХ...</text>
  <rect x="460" y="240" width="8" height="12" fill="#33ff66"/>

  <!-- Mechanical Heavy Keyboard -->
  <polygon points="260,390 540,390 520,345 280,345" fill="#1b1d20" stroke="#000" stroke-width="2"/>
  <!-- Key rows -->
  <line x1="285" y1="355" x2="515" y2="355" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="367" x2="520" y2="367" stroke="#333" stroke-width="2"/>
  <line x1="275" y1="379" x2="525" y2="379" stroke="#333" stroke-width="2"/>

  <!-- Dossier & Papers on Left Desk -->
  <polygon points="90,320 220,310 230,395 100,410" fill="#d9d2c5" stroke="#222" stroke-width="1.5"/>
  <polygon points="95,315 225,305 235,390 105,405" fill="#c4bcad" stroke="#333" stroke-width="1"/>
  <text x="140" y="340" fill="#8b0000" font-family="monospace" font-size="9" font-weight="bold" transform="rotate(-4 140 340)">ПРИКАЗ №114</text>
  <line x1="110" y1="355" x2="200" y2="348" stroke="#555" stroke-width="1.5"/>
  <line x1="112" y1="368" x2="205" y2="361" stroke="#555" stroke-width="1.5"/>
  <line x1="115" y1="380" x2="190" y2="374" stroke="#555" stroke-width="1.5"/>

  <!-- Metal Mug on Right Desk with Steam -->
  <rect x="600" y="320" width="35" height="45" rx="3" fill="#6c737a" stroke="#222" stroke-width="1.5"/>
  <path d="M 635 330 C 648 330 648 355 635 355" fill="none" stroke="#6c737a" stroke-width="4"/>

  <!-- Operator Silhouette from Back (Lower foreground) -->
  <path d="M 230 450 C 240 370 290 340 380 340 C 470 340 520 370 530 450 Z" fill="#0c0d0f" stroke="#000" stroke-width="4"/>
  <!-- Head silhouette -->
  <ellipse cx="380" cy="305" rx="42" ry="50" fill="#0c0d0f" stroke="#000" stroke-width="3"/>

  <!-- Light beam from monitor onto operator silhouette -->
  <polygon points="275,300 525,300 500,370 300,370" fill="#33ff66" opacity="0.08"/>
</svg>